server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # ---- auth-service ----
    location /auth/      { proxy_pass http://auth-service:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /users/     { proxy_pass http://auth-service:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/users/ { proxy_pass http://auth-service:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ---- live notifications (SSE): no buffering, long timeout ----
    location /api/notifications/subscribe {
        proxy_pass http://institute-management:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- institute-management ----
    location /api/     { proxy_pass http://institute-management:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /uploads/ { proxy_pass http://institute-management:8080; proxy_set_header Host $host; }

    # ---- frontend (React SPA) ----
    location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
